<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EchoMind – Multi-LLM Comparator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }
    textarea {
      width: 100%;
      height: 80px;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      margin-top: 10px;
      font-size: 16px;
      cursor: pointer;
    }
    .container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 20px;
    }
    .card {
      background: white;
      padding: 15px;
      border-radius: 6px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }
    .score {
      font-weight: bold;
      margin-top: 10px;
    }
    .meta {
      margin-top: 15px;
      font-style: italic;
      color: #555;
    }
  </style>
</head>

<body>

<h2>EchoMind – Multi-LLM Response Comparison System</h2>

<p>Enter a prompt to compare responses across different Large Language Models.</p>

<textarea id="prompt" placeholder="Example: Explain black holes to a beginner"></textarea>
<br>
<button onclick="runEchoMind()">Compare Models</button>

<div class="container">
  <div class="card">
    <h3>GPT Model</h3>
    <p id="gptOutput"></p>
    <div class="score" id="gptScore"></div>
  </div>

  <div class="card">
    <h3>Claude Model</h3>
    <p id="claudeOutput"></p>
    <div class="score" id="claudeScore"></div>
  </div>

  <div class="card">
    <h3>Open-Source LLM</h3>
    <p id="openOutput"></p>
    <div class="score" id="openScore"></div>
  </div>
</div>

<div class="meta" id="taskInfo"></div>
<h3 id="recommendation"></h3>

<script>
  // ==============================
  // Prompt History Module
  // ==============================
  let promptHistory = [];

  function savePrompt(prompt) {
    if (prompt.trim() !== "") {
      promptHistory.push(prompt);
      console.log("Prompt History:", promptHistory);
    }
  }

  // ==============================
  // Task Detection Module
  // ==============================
  function detectTask(prompt) {
    const p = prompt.toLowerCase();
    if (p.includes("explain")) return "Education";
    if (p.includes("code") || p.includes("program")) return "Programming";
    if (p.includes("summarize")) return "Summarization";
    return "General Query";
  }

  // ==============================
  // LLM Adapter Layer (Mocked)
  // ==============================
  function gptAdapter(prompt) {
    return "A black hole is a region in space where gravity is extremely strong. Nothing, not even light, can escape from it. Black holes usually form when massive stars collapse.";
  }

  function claudeAdapter(prompt) {
    return "Black holes form when massive stars collapse under their own gravity. They strongly affect space and time and are studied using Einstein’s theory of relativity.";
  }

  function openSourceAdapter(prompt) {
    return "A black hole is a gravitational singularity characterized by an event horizon, derived from exact solutions of Einstein's field equations.";
  }

  // ==============================
  // Scoring Engine
  // ==============================
  function scoreResponse(text) {
    return {
      clarity: Math.floor(Math.random() * 3) + 7,
      depth: Math.floor(Math.random() * 3) + 6,
      readability: Math.floor(Math.random() * 3) + 7
    };
  }

  // ==============================
  // Core Orchestration Pipeline
  // ==============================
  function runEchoMind() {
    const prompt = document.getElementById("prompt").value;

    savePrompt(prompt);

    const taskType = detectTask(prompt);
    document.getElementById("taskInfo").innerText =
      "Detected Task Type: " + taskType;

    const gptText = gptAdapter(prompt);
    const claudeText = claudeAdapter(prompt);
    const openText = openSourceAdapter(prompt);

    document.getElementById("gptOutput").innerText = gptText;
    document.getElementById("claudeOutput").innerText = claudeText;
    document.getElementById("openOutput").innerText = openText;

    const gptScore = scoreResponse(gptText);
    const claudeScore = scoreResponse(claudeText);
    const openScore = scoreResponse(openText);

    document.getElementById("gptScore").innerText =
      `Clarity: ${gptScore.clarity}/10 | Depth: ${gptScore.depth}/10 | Readability: ${gptScore.readability}/10`;

    document.getElementById("claudeScore").innerText =
      `Clarity: ${claudeScore.clarity}/10 | Depth: ${claudeScore.depth}/10 | Readability: ${claudeScore.readability}/10`;

    document.getElementById("openScore").innerText =
      `Clarity: ${openScore.clarity}/10 | Depth: ${openScore.depth}/10 | Readability: ${openScore.readability}/10`;

    if (taskType === "Education") {
      document.getElementById("recommendation").innerText =
        "Recommended Model: GPT (best for beginner-friendly explanations)";
    } else if (taskType === "Programming") {
      document.getElementById("recommendation").innerText =
        "Recommended Model: Open-Source LLM (better technical depth)";
    } else {
      document.getElementById("recommendation").innerText =
        "Recommended Model: Claude (balanced reasoning)";
    }
  }
</script>

</body>
</html>
